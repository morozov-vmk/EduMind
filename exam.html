<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Режим реальных задач ЕГЭ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container exam-mode">
    <!-- Верхняя панель -->
    <div class="top-panel">
      <!-- Левая часть - теги (кликабельные) -->
      <div class="exam-tags" id="examTags">
        <!-- Теги будут добавлены динамически -->
      </div>
      
      <!-- Правая часть - функциональные кнопки -->
      <div class="exam-actions">
        <button class="action-btn" id="hintBtn">Подсказка</button>
        <button class="action-btn" id="solutionBtn">Решение</button>
        <button class="action-btn" id="statisticsBtn">Статистика</button>
        <button class="nav-btn secondary" onclick="window.location.href='tags.html'">
          К изучению тем
        </button>
      </div>
    </div>

    <!-- Основное содержимое -->
    <div class="main-content">
      <!-- Левая колонка - условие задачи -->
      <div class="exam-left">
        <div class="section-header">
          <h2>Задание <span id="examTaskNumber">5</span> ЕГЭ</h2>
          <div class="difficulty">Сложность: Средняя</div>
        </div>
        
        <div class="task-content" id="taskContent">
          <!-- Условие реальной задачи ЕГЭ -->
        </div>
        
        <div class="code-section">
          <div class="code-header">
            <span>Ваше решение</span>
            <button class="upload-btn small" id="examUploadBtn">
              📁 Загрузить .py
            </button>
          </div>
          <textarea id="examCodeInput" placeholder="Введите решение на Python..."></textarea>
        </div>
      </div>

      <!-- Правая колонка - ответ LLM -->
      <div class="exam-right">
        <div class="section-header">
          <h3>Проверка решения</h3>
          <div class="timer" id="timer">⏱️ 00:00</div>
        </div>
        
        <div class="llm-response" id="examLlmResponse">
          <!-- Ответ LLM будет здесь -->
          <div class="placeholder">
            Решение будет проверено автоматически после отправки
          </div>
        </div>
        
        <div class="answer-input-section">
          <input 
            type="text" 
            id="examAnswerInput" 
            placeholder="Числовой ответ (если требуется)..."
            class="answer-input"
          >
          <button class="submit-btn large" id="examSubmitBtn">
            Отправить на проверку
          </button>
        </div>
        
        <div class="statistics">
          <h4>Ваша статистика:</h4>
          <div class="stats-grid">
            <div class="stat-item">
              <span class="stat-value">5</span>
              <span class="stat-label">решено</span>
            </div>
            <div class="stat-item">
              <span class="stat-value">80%</span>
              <span class="stat-label">точность</span>
            </div>
            <div class="stat-item">
              <span class="stat-value">12:34</span>
              <span class="stat-label">среднее время</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Нижняя панель -->
    <div class="bottom-panel">
      <button class="nav-btn secondary" id="prevTaskBtn" disabled>
        ← Предыдущая задача
      </button>
      <button class="nav-btn" id="nextExamTaskBtn">
        Следующая задача →
      </button>
      <div class="task-counter">
        Задача <span id="currentTaskNum">5</span> из 27
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const selectedTask = localStorage.getItem('selectedTask') || 5;
      document.getElementById('examTaskNumber').textContent = selectedTask;
      document.getElementById('currentTaskNum').textContent = selectedTask;
      
      // Данные для задач ЕГЭ
      const examTasks = {
        5: {
          title: "Анализ алгоритмов",
          difficulty: "Средняя",
          content: `
            <h3>Задание 5 ЕГЭ по информатике</h3>
            <p><strong>Условие:</strong></p>
            <p>На вход алгоритма подаётся натуральное число N. Алгоритм строит по нему новое число R следующим образом:</p>
            <ol>
              <li>Строится двоичная запись числа N.</li>
              <li>К этой записи дописываются справа ещё два разряда по следующему правилу:
                <ul>
                  <li>Складываются все цифры двоичной записи, и остаток от деления суммы на 2 дописывается в конец числа (справа).</li>
                  <li>Над этой записью производятся те же действия – справа дописывается остаток от деления суммы цифр на 2.</li>
                </ul>
              </li>
            </ol>
            <p>Полученная таким образом запись (в ней на два разряда больше, чем в записи исходного числа N) является двоичной записью искомого числа R.</p>
            
            <p><strong>Пример:</strong></p>
            <pre>Дано число N = 13. Алгоритм работает следующим образом:
1. Двоичная запись 13: 1101
2. Сумма цифр: 1+1+0+1 = 3, остаток 3 mod 2 = 1 → 11011
3. Сумма цифр: 1+1+0+1+1 = 4, остаток 4 mod 2 = 0 → 110110
4. Результат: 110110₂ = 54</pre>
            
            <p><strong>Задание:</strong></p>
            <p>Укажите минимальное число N, для которого результат работы алгоритма больше 75. В ответе запишите это число в десятичной системе счисления.</p>
          `,
          answer: "84",
          tags: ["двоичная система", "алгоритмы", "остатки"]
        }
      };
      
      // Загружаем задачу
      const currentTask = examTasks[selectedTask];
      if (currentTask) {
        document.getElementById('taskContent').innerHTML = currentTask.content;
        
        // Добавляем теги
        const examTags = document.getElementById('examTags');
        currentTask.tags.forEach(tag => {
          const tagElement = document.createElement('span');
          tagElement.className = 'exam-tag clickable';
          tagElement.textContent = tag;
          tagElement.addEventListener('click', function() {
            localStorage.setItem('selectedTag', tag);
            window.location.href = 'study.html';
          });
          examTags.appendChild(tagElement);
        });
      }
      
      // Таймер
      let seconds = 0;
      const timerElement = document.getElementById('timer');
      setInterval(() => {
        seconds++;
        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;
        timerElement.textContent = `⏱️ ${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      }, 1000);
      
      // Обработчики кнопок
      const hintBtn = document.getElementById('hintBtn');
      const solutionBtn = document.getElementById('solutionBtn');
      const submitBtn = document.getElementById('examSubmitBtn');
      const nextBtn = document.getElementById('nextExamTaskBtn');
      
      hintBtn.addEventListener('click', function() {
        const response = document.getElementById('examLlmResponse');
        response.innerHTML = `
          <div class="hint-content">
            <h4>💡 Подсказка:</h4>
            <p>1. Внимательно прочитайте алгоритм преобразования числа</p>
            <p>2. Начните с небольших чисел N и проверяйте результат R</p>
            <p>3. Обратите внимание на сумму цифр двоичного представления</p>
            <p>4. Используйте цикл для перебора возможных значений N</p>
          </div>
        `;
      });
      
      solutionBtn.addEventListener('click', function() {
        const response = document.getElementById('examLlmResponse');
        response.innerHTML = `
          <div class="solution-content">
            <h4>🔧 Решение:</h4>
            <pre><code>def algorithm(N):
    # Шаг 1: двоичное представление
    binary = bin(N)[2:]
    
    # Шаг 2: два раза добавляем остаток
    for _ in range(2):
        s = sum(int(digit) for digit in binary)
        binary += str(s % 2)
    
    # Преобразуем обратно в десятичное
    return int(binary, 2)

# Поиск минимального N
for N in range(1, 100):
    R = algorithm(N)
    if R > 75:
        print(f"N = {N}, R = {R}")
        break</code></pre>
            <p><strong>Ответ: 84</strong></p>
          </div>
        `;
      });
      
      submitBtn.addEventListener('click', function() {
        const code = document.getElementById('examCodeInput').value;
        const answer = document.getElementById('examAnswerInput').value;
        
        // Имитация проверки
        const response = `
          <div class="verdict-content">
            <h4>✅ Проверка завершена!</h4>
            
            <div class="verdict-details">
              <p><strong>Корректность:</strong> ${answer === currentTask.answer ? '✓ Правильно' : '✗ Неправильно'}</p>
              <p><strong>Время решения:</strong> ${Math.floor(seconds/60)}:${(seconds%60).toString().padStart(2, '0')}</p>
              <p><strong>Оценка алгоритма:</strong> ${answer === currentTask.answer ? 'Принято' : 'Требует доработки'}</p>
            </div>
            
            <div class="recommendations">
              <h5>Рекомендации:</h5>
              <ul>
                <li>Проверьте обработку граничных случаев</li>
                <li>Убедитесь в эффективности алгоритма</li>
                <li>Протестируйте на нескольких примерах</li>
              </ul>
            </div>
          </div>
        `;
        
        document.getElementById('examLlmResponse').innerHTML = response;
      });
      
      nextBtn.addEventListener('click', function() {
        // В реальной системе здесь будет переход к следующей задаче
        // Пока просто показываем сообщение
        alert('Следующее задание пока недоступно. Продолжайте тренироваться на текущем!');
      });
      
      // Загрузка файла
      document.getElementById('examUploadBtn').addEventListener('click', function() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.py';
        input.onchange = function(e) {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
              document.getElementById('examCodeInput').value = event.target.result;
            };
            reader.readAsText(file);
          }
        };
        input.click();
      });
    });
  </script>
</body>
</html>
